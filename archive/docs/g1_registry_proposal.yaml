# PROPOSED / UNVERIFIED — NOT the canonical registry.
#
# Companion to docs/g1_registry_proposal.md, which carries the evidence for every
# row. This file exists so the pre-audit stage can be pointed at it:
#
#   uv run python -m hexis.pipeline.run_audit --pre-audit \
#       --overrides docs/g1_registry_proposal.yaml
#
# It is executable ONLY under --pre-audit, and `_status` below **enforces** that
# rather than merely asserting it: the audit stage refuses to produce a canonical
# report from any overrides file whose `_status` is not RATIFIED. Keys beginning
# with `_` are reserved metadata and are never read as document assignments.
#
# config/registry_overrides.yaml, the file that declares human-verified
# assignments (§3.3, D04), stays empty until the owner ratifies these rows.
# Nothing here may be copied there by an agent.
_status: PROPOSED
