[project]
name = "hexis"
version = "0.1.0"
description = "HEXIS: morphosyntactic organization under metrical constraint, measured by a single Rissanen-style MDL context-tree instrument (Spec v2.0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "conllu",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexis"]
