[project]
name = "hexis"
version = "0.1.0"
description = "HEXIS: morphosyntactic organization under metrical constraint, measured by a single Rissanen-style MDL context-tree instrument (Spec v2.0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "conllu",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexis"]

[tool.pytest.ini_options]
# Collection is confined to tests/ (Spec §7). candidates/ holds quarantined
# non-canonical implementations (D47) whose test basenames collide with the
# canonical suite; they must never enter the G0 or G3 test sets.
testpaths = ["tests"]
norecursedirs = ["candidates", ".venv", "data", "results", "notebooks"]
