[project]
name = "hexis"
version = "0.1.0"
description = "HEXIS: morphosyntactic organization under metrical constraint, measured by a single Rissanen-style MDL context-tree instrument (Spec v2.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "conllu",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexis"]

[tool.pytest.ini_options]
# Collection is confined to tests/ (Spec §7). candidates/ holds quarantined
# non-canonical implementations (D47) whose test basenames collide with the
# canonical suite; they must never enter the G0 or G3 test sets.
testpaths = ["tests"]
# G0 gate mechanics (D52(iii)/D45): reject unregistered markers and turn an xpass
# into a failure; the root conftest also requires an executed Python assert.
addopts = "--strict-markers"
enable_assertion_pass_hook = true
xfail_strict = true
markers = [
    "g0: Gate G0 acceptance tests (D52); incomplete until all mandatory coverage is implemented",
    "g1: Gate G1 audit tests (D55 §xiv, convention 13 — PROPOSED); same no-skip/real-assert enforcement as g0",
]
norecursedirs = ["candidates", ".venv", "data", "results", "notebooks"]
