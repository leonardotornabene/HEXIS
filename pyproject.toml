[project]
# The distribution keeps the name `hexis`: uv.lock records it, and the deposited
# design fixes the lock bytes (runtime.lock_sha256). The package is `hormathos` (V3-003).
name = "hexis"
version = "0.1.0"
description = "HORMATHOS (design HEXIS 3.1): descriptive within-sentence annotation order in a finite Greek corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "conllu",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hormathos"]

[tool.pytest.ini_options]
# Collection is confined to tests/: archive/ holds the historical suites, which
# are a record and are never collected, not even when pytest starts from the root.
testpaths = ["tests"]
norecursedirs = ["archive", ".*", "data", "results", "notebooks"]
# Reject unregistered markers and turn an xpass into a failure; the root conftest
# also requires an executed assert and refuses any test without the marker.
addopts = "--strict-markers"
enable_assertion_pass_hook = true
xfail_strict = true
markers = [
    "v31: active acceptance; no skip, no placeholder",
]
