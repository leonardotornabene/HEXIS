[project]
name = "hexis"
version = "0.1.0"
description = "HEXIS 3.1: descriptive within-sentence annotation order in a finite Greek corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "conllu",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexis"]

[tool.pytest.ini_options]
# Collection is confined to tests/: archive/ holds the historical suites, which
# are a record and are never collected.
testpaths = ["tests"]
# Reject unregistered markers and turn an xpass into a failure; the root conftest
# also requires an executed assert and refuses any test without the marker.
addopts = "--strict-markers"
enable_assertion_pass_hook = true
xfail_strict = true
markers = [
    "v31: active acceptance; no skip, no placeholder",
]
